# Shared QLoRA defaults. Sweep overlays live in configs/train/sweep.yaml.
#
# Every value below has a reason. Where the reason is "measure it in Phase N",
# that is stated rather than dressed up as a decision.

model_name: Qwen/Qwen2.5-7B-Instruct

lora:
  # Sweep tests 16 vs 64. At ~4k training examples, higher rank mostly buys
  # capacity to overfit; sweeping tests that claim instead of assuming it.
  r: 16

  # Expressed as a RATIO to r, not an absolute alpha. LoRA scales its update by
  # alpha/r, so holding the ratio fixed keeps effective update magnitude
  # constant when r changes. The learning rate then needs no re-tuning per
  # rank, and the r=16 vs r=64 comparison measures rank rather than a
  # confounded change in effective learning rate. This is what makes the sweep
  # interpretable.
  alpha_ratio: 2.0

  # Light regularization for ~4k examples. 0 risks memorization; 0.1 is
  # unnecessarily strong at this rank.
  dropout: 0.05

  # All seven linear projections — attention AND MLP. The QLoRA paper's central
  # ablation: adapting every linear layer is what closes the gap to full
  # fine-tuning; attention-only measurably underperforms. Adapters are ~0.5% of
  # parameters, so the extra cost is noise.
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

# QLoRA paper default for 7B. LoRA tolerates ~10x full-finetuning learning
# rates because B is zero-initialized: the model starts at exactly the base
# function and the adapters cannot blow up early.
learning_rate: 2.0e-4
lr_scheduler_type: cosine
# Warmup matters more than usual here: gradients are large in the first steps
# while B departs from zero.
warmup_ratio: 0.03
num_train_epochs: 3

# Effective batch = 2 x 4 = 8.
#
# REVISED after Phase 1 measured the data. The plan assumed ~4k examples of
# ~600 tokens and set this to 16, expecting ~250 optimizer steps/epoch. The
# real set is 2,583 examples averaging 114 tokens, so with packing at
# seq_len 512 an epoch is only ~575 sequences. At effective batch 16 that is
# 36 steps/epoch - 108 steps total over 3 epochs, which is too few for a
# cosine schedule with warmup to mean anything.
#
# Halving to 8 gives ~72 steps/epoch (~215 total). Still modest, which is a
# genuine limitation of a small synthetic set rather than something a batch
# size can fix; it is called out in reports/dataset_card.md rather than
# hidden. VRAM is not the constraint here - peak was 11.9 GiB of 24 at
# seq_len 2048, and seq_len is now 512.
per_device_train_batch_size: 2
gradient_accumulation_steps: 4

# MEASURED in Phase 1, not guessed. See reports/dataset_card.md.
#   p50 108 | p95 162 | p99 180 | max 221 | mean 113.9
#
# The plan assumed ~600 tokens and 2048 here. Both were wrong, for a
# structural reason: a training example is question + formatted answer with
# NO passage, because the no-retrieval arm must recall parametrically. There
# is no long context to hold. Padding to 2048 would have wasted ~11x the
# compute for nothing.
max_seq_length: 512
packing: true

# ~30% slower, but it creates the VRAM headroom that keeps a run alive when
# another user takes GPU memory. This box is shared; robustness beats speed.
gradient_checkpointing: true

# 8-bit optimizer states cut optimizer memory ~4x, and paging survives
# transient VRAM spikes instead of OOM-ing. On a shared GPU that robustness is
# worth more than full AdamW's marginal quality difference.
optim: paged_adamw_8bit
bf16: true
seed: 42

# Checkpointing every epoch is what makes the epoch axis FREE: the sweep reads
# epochs 1/2/3 out of a single run instead of launching one run per epoch
# count. That single decision collapses a 12-run grid to 4 and is most of the
# difference between a ~75 GPU-hour plan and a ~24 GPU-hour one.
save_strategy: epoch
eval_strategy: epoch
