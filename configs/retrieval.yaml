# ===========================================================================
# RETRIEVAL CONFIGURATION - HELD FIXED ACROSS DOMAINS
#
# These values were originally mirrored from VidyaRAG's frozen `baseline`
# profile, so that this benchmark's RAG arm was the same pipeline as the
# author's RAG project. THAT JUSTIFICATION IS NO LONGER LIVE: VidyaRAG indexes
# OpenStax biology and this corpus is Indian statutes, so the apples-to-apples
# claim it supported does not apply.
#
# They remain pinned for a different reason that still holds: retrieval must be
# constant so the legal and biology runs of this benchmark can be compared to
# each other. tests/test_retrieval_config.py hard-codes these values, so a
# silent change fails loudly instead of quietly making two domains
# incomparable.
# ===========================================================================

# --- Chunking ---------------------------------------------------------------
# 512 tokens with 64 overlap, carried over unchanged from the biology run.
#
# On statutes the parameter barely bites: the median section is ~550 characters
# against ~13,000 for a textbook section, so most sections fall inside a single
# chunk and chunk, section and citation unit coincide. That removes the usual
# RAG failure of retrieving half a provision - a real gain, but an accident of
# the corpus rather than a tuned choice.
chunking:
  chunk_size: 512
  chunk_overlap: 64
  respect_sentence_boundaries: true

# --- Retrieval --------------------------------------------------------------
# top_k_retrieve > top_k_context by design: a reranker can only add value when
# given a candidate pool wider than the final selection.
top_k_retrieve: 20
top_k_context: 5

# The baseline profile is dense retrieval with no enhancements. Every one of
# these stays false for this benchmark: the RAG arm of a 2x2 must be a clean,
# frozen control, not VidyaRAG's best-tuned configuration. Comparing a tuned
# RAG stack against an untuned fine-tune would be its own confound.
use_hybrid: false
use_reranker: false
use_decomposition: false
